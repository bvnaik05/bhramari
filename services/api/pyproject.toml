[project]
name = "bhramari-api"
version = "0.1.0"
description = "Bhramari traceability, field access and trust API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3", "cryptography>=44,<47", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
bhramari = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
