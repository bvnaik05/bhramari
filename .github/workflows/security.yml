name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  # CodeQL reads the workflow run it belongs to; private repos must grant it.
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r <(python -c "import tomllib; print('\n'.join(tomllib.load(open('services/api/pyproject.toml','rb'))['project']['dependencies']))")
        shell: bash
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm audit --audit-level=high --omit=dev --prefix apps/web
      - run: npm audit --audit-level=high --omit=dev --prefix services/ledger
      - run: npm audit --audit-level=high --omit=dev --prefix contracts

  codeql:
    runs-on: ubuntu-latest
    strategy:
      # One language failing should not cancel the other's analysis.
      fail-fast: false
      matrix: {language: [javascript-typescript, python]}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}"}
      # Code scanning is not enabled on this private repository, so results
      # are kept as an artifact instead of uploaded. Enable code scanning in
      # the repository settings and drop "upload: never" to see them in the
      # Security tab.
      - uses: github/codeql-action/analyze@v3
        with: {upload: never, output: codeql-results}
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit: the old un-prefixed tags were removed upstream.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # The scan step above fails the job on HIGH/CRITICAL findings; the
      # report is kept as an artifact while code scanning is disabled.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: bhramari-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bhramari-sbom
          path: bhramari-sbom.cdx.json
